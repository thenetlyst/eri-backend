<!DOCTYPE html>
<html>
<head>
  <title>ERI Participant</title>
</head>
<body>

<h2>ERI Exam</h2>

<!-- LOGIN -->
<div id="login">
  <input id="email" placeholder="Email" />
  <button onclick="login()">Login</button>
</div>

<hr/>

<!-- EXAM -->
<div id="exam" style="display:none">

  <h3 id="question"></h3>

  <!-- OPTIONS -->
  <div id="options"></div>

  <br/>

  <!-- NAVIGATION -->
  <div id="navigation">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="nextQuestion()">Next</button>
  </div>

  <br/>

  <!-- FINAL SUBMIT -->
  <div>
    <button onclick="finalizeAttempt()">Submit Exam</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
