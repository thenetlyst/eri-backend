  nginx:
    image: nginx:1.27-alpine
    container_name: eri-nginx

    depends_on:
      eri-backend-1:
        condition: service_started
#      eri-backend-2:
#        condition: service_started

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    restart: unless-stopped


    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # -------------------------
  # ⚙️ WORKER
  # -------------------------
  eri-worker:
    build: .
    container_name: eri-worker
    depends_on:
      migrations:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://exam_user:exam_password@pgbouncer:5432/exam_platform

    volumes:
      - ./firebase_service_account.json:/app/firebase_service_account.json:ro    


    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    command: >
      sh -c "
      echo '⏳ Waiting for PgBouncer...' &&
      until pg_isready -h pgbouncer -p 5432 -U exam_user; do sleep 2; done &&
      echo '🚀 Starting worker...' &&
      python -m app.workers.finalize_runner
      "
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

 

volumes:
  postgres_data:

  




