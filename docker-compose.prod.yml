

services:

  # -------------------------
  # 🗄️ DATABASE (SCRAM)
  # -------------------------
  exam_db:
    image: postgres:15
    container_name: exam_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=400
      -c password_encryption=scram-sha-256

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  # -------------------------
  # ⚡ PGBOUNCER
  # -------------------------
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: eri-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:5432"

    environment:
      DB_USER: exam_user
      DB_PASSWORD: exam_password
      DB_HOST: exam_db
      DB_NAME: exam_platform
      ADMIN_USERS: exam_user
      STATS_USERS: exam_user

      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 200
      RESERVE_POOL_SIZE: 50

      AUTH_TYPE: plain

    depends_on:
      exam_db:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U exam_user -d exam_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  # -------------------------
  # 🧱 MIGRATIONS
  # -------------------------
  migrations:
    build: .
    container_name: eri-migrations
    depends_on:
      exam_db:
        condition: service_started
    env_file:
      - .env.production

    command: >
      sh -c "
      echo '⏳ Waiting for Postgres...' &&
      until pg_isready -h exam_db -p 5432 -U exam_user; do sleep 2; done &&
      echo '🚀 Running migrations...' &&
      alembic upgrade head &&
      echo '✅ Migrations complete'
      "

  # -------------------------
  # 🚀 BACKEND 1
  # -------------------------
  eri-backend-1:
    build: .
    container_name: eri-backend-1
    ports:
      - "8001:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      exam_db:
        condition: service_started
    env_file:
      - .env.production
    environment:
      - ENABLE_API_STATS=false
      - DATABASE_URL=postgresql://exam_user:exam_password@pgbouncer:5432/exam_platform

    volumes:
      - ./firebase_service_account.json:/app/firebase_service_account.json:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    command:
      - gunicorn
      - app.main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "6"
      - --bind
      - 0.0.0.0:8000
      - --backlog
      - "2048"
      - --timeout
      - "60"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

